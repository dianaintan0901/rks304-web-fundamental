<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - QwenGlasses</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
    <div class="flex items-center gap-2 mb-6">
      <div class="w-9 h-9 rounded-md bg-cyan-500 text-white flex items-center justify-center font-semibold">S</div>
      <span class="text-lg font-semibold text-slate-900">QwenGlasses</span>
    </div>
    <h1 class="text-xl font-semibold text-slate-900 mb-1">Buat akun baru</h1>
    <p class="text-sm text-slate-500 mb-6">Lengkapi data di bawah ini untuk mendaftar.</p>

    <form id="registerForm" action="dashboard.html" novalidate class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
        <p class="error-message text-xs text-red-500 mt-1 hidden"></p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" name="password" placeholder="Masukkan password"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
        <p class="error-message text-xs text-red-500 mt-1 hidden"></p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nama</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
        <p class="error-message text-xs text-red-500 mt-1 hidden"></p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Lahir</label>
        <input type="date" id="tanggal_lahir" name="tanggal_lahir"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
        <p class="error-message text-xs text-red-500 mt-1 hidden"></p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Alamat</label>
        <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500"></textarea>
        <p class="error-message text-xs text-red-500 mt-1 hidden"></p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nomor Telepon</label>
        <input type="text" id="no_telp" name="no_telp" placeholder="Contoh: 6281234567890"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
        <p class="error-message text-xs text-red-500 mt-1 hidden"></p>
      </div>

      <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-medium py-2 rounded-md transition-colors">
        Daftar
      </button>

      <p class="text-sm text-slate-500 text-center">
        Sudah punya akun? <a href="index.html" class="text-cyan-600 hover:underline">Masuk di sini</a>
      </p>
    </form>
  </div>

  <script src="validasi_input.js"></script>
</body>
</html>

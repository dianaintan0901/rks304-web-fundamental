<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - QwenGlasses</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-lg shadow-lg p-8">
    <div class="flex items-center gap-2 mb-6">
      <div class="w-9 h-9 rounded-md bg-cyan-500 text-white flex items-center justify-center font-semibold">S</div>
      <span class="text-lg font-semibold text-slate-900">QwenGlasses</span>
    </div>
    <h1 class="text-xl font-semibold text-slate-900 mb-1">Masuk ke akun</h1>
    <p class="text-sm text-slate-500 mb-6">Masukkan username dan password untuk melanjutkan.</p>
    <form action="dashboard.html" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input type="text" name="username" placeholder="Masukkan username" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" name="password" placeholder="Masukkan password" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
      </div>
      <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-medium py-2 rounded-md transition-colors">Login</button>
    </form>
  </div>
</body>
</html>

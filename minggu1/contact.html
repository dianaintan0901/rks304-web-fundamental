  <main class="contact-container">
    
    <!-- Left Column: Pure HTML Contact Form -->
    <div class="contact-form-col">
      <form class="contact-form" action="#" method="POST">
        
        <!-- Field 1: Nama -->
        <div class="form-group">
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama" class="form-input" placeholder="Masukkan nama lengkap..." required>
        </div>

        <!-- Field 2 & 3: Email and Phone (Row) -->
        <div class="form-row">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="nama@email.com" required>
          </div>
          <div class="form-group">
            <label for="phone">Nomor Hp</label>
            <input type="tel" id="phone" name="phone" class="form-input" placeholder="+62 8xx..." required>
          </div>
        </div>

        <!-- Field: Kategori / Keperluan (Dropdown) -->
        <div class="form-group">
          <label for="kategori">Kategori / Keperluan</label>
          <select id="kategori" name="kategori" class="form-select" required>
            <option value="" disabled selected>Pilih Kategori...</option>
            <option value="Konsultasi">Konsultasi</option>
            <option value="Kolaborasi Proyek">Kolaborasi Proyek</option>
            <option value="Pertanyaan Umum">Pertanyaan Umum</option>
          </select>
        </div>

        <!-- Field 4: Pesan -->
        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan" rows="5" class="form-textarea" placeholder="Tuliskan pesan Anda..." required></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="form-submit-btn">Kirim Pesan</button>
      </form>
    </div>

    <!-- Right Column: Contact Us Details & Social Icons -->
    <div class="contact-info-col">
      <h1 class="contact-info-title">Contact Us</h1>
      <p class="contact-info-desc">
        Jika ingin berdiskusi, bertanya, atau berkolaborasi dalam sebuah project, silakan kirimkan pesan melalui form di bawah.
      </p>
